[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pydada2"  # NOTE: taken on PyPI by another project; to be renamed before publishing there
version = "0.1.0"
description = "Exact amplicon sequence variant inference (DADA2) for Python"
readme = "README.md"
license = "LGPL-3.0-or-later"  # DADA2 is LGPL; latest LGPL version (README, "License")
license-files = ["LICENSE", "COPYING", "THIRD_PARTY_NOTICES.md"]
# Author of the port. DADA2 itself (the method and the code ported here) is by Callahan et al.:
# see README "Citation" and CITATION.cff (preferred-citation).
authors = [{ name = "Sebastian Proost", email = "sebastian.proost@vib.be" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "click>=8.1",  # command-line interface (cli.py)
  "numpy>=1.26",
  "pandas>=2.2",
  "dnaio>=1.2",
  "xopen>=1.4",  # gzip output (io.py); also a dnaio dependency
  "scikit-misc>=0.5.1",  # 0.5.0 is yanked (broken with numpy 1.x)
]

[project.scripts]
pydada2 = "pydada2.cli:main"

[project.urls]
Homepage = "https://github.com/raeslab/pyDADA2"
Source = "https://github.com/raeslab/pyDADA2"
Upstream = "https://github.com/benjjneb/dada2"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3",
  "pytest-benchmark>=4",
  "hypothesis>=6",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "pre-commit>=3",
  # build backend + bindings, needed in the env for editable rebuilds (no build isolation)
  "scikit-build-core>=0.11",
  "nanobind>=2.4",
]

[tool.uv]
no-build-isolation-package = ["pydada2"]
# Supply-chain hygiene: ignore releases newer than this date when locking.
exclude-newer = "2026-10-01T00:00:00Z"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/pydada2"]
editable.rebuild = true
editable.verbose = false
wheel.py-api = "cp312"  # abi3 wheels for CPython >= 3.12 (nanobind STABLE_ABI); per-version for 3.11
sdist.exclude = [
  "/tests/", "benchmarks/", ".devcontainer/", ".github/", "scripts/", "build/",
  "CLAUDE.md", "Dockerfile", ".dockerignore", ".pre-commit-config.yaml", ".clangd",
]

[tool.scikit-build.cmake.define]
DADA2_ENABLE_COVERAGE = { env = "DADA2_ENABLE_COVERAGE", default = "OFF" }
DADA2_BUILD_CPP_TESTS = { env = "DADA2_BUILD_CPP_TESTS", default = "OFF" }
DADA2_FETCH_BOOST = { env = "DADA2_FETCH_BOOST", default = "ON" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=pydada2 --cov-branch --cov-report=term-missing -m 'not bench' --doctest-modules --import-mode=importlib"
testpaths = ["tests", "src/pydada2"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
pythonpath = ["tests"]
markers = [
  "parity: compares against fixtures generated from the R package",
  "slow: long-running (full pipeline)",
  "bench: micro-benchmarks (not run by default)",
]

[tool.coverage.run]
source = ["pydada2"]

[tool.coverage.report]
# The 90 % gate applies to the full run only, so it is passed on the command line
# (`pytest -m "not slow" --cov-fail-under=90`: CI and the pre-commit hook). Marker subsets such as
# `pytest -m parity` or `-m slow` report coverage but do not fail on it.
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PD", "D"]

[tool.ruff.lint.isort]
known-first-party = ["pydada2"]
known-local-folder = ["rparity"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"src/**" = [
  "D105",  # magic methods (__len__, __repr__) need no docstring
  "N803",  # `X` argument name (scikit-learn convention)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "N806"]  # tests mirror R variable names (ddF, dR, ...)
"benchmarks/**" = ["D"]
"scripts/**" = ["D"]
"src/pydada2/_core.pyi" = ["D", "N"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["skmisc.*", "dnaio.*"]
ignore_missing_imports = true
