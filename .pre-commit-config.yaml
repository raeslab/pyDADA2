# Quality gates (spec §10.1). Install with: uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pytest-fast
        name: pytest (not slow)
        entry: uv run pytest -m "not slow" -q -p no:cacheprovider
        language: system
        pass_filenames: false
        stages: [pre-push]
